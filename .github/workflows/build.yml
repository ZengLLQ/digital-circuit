name: Release Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install NPM dependencies
        run: npm ci

      - name: Run Rust unit and mathematical verification tests
        run: cargo test
        working-directory: ./src-tauri

      - name: Build frontend
        run: npm run build

      - name: Build Tauri desktop application & NSIS installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v__VERSION__') || '' }}
          releaseName: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') && format('Karnaugh Studio {0}', github.ref_name) || 'Karnaugh Studio v__VERSION__') || '' }}
          releaseBody: 'Release build of Karnaugh Studio with Windows NSIS installer.'
          releaseDraft: false
          prerelease: false

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe
          if-no-files-found: error
