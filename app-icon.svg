<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Group 1 Gradient (Cyan) -->
    <linearGradient id="groupCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.35" />
    </linearGradient>

    <!-- Group 2 Gradient (Indigo/Violet) -->
    <linearGradient id="groupViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.35" />
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />

  <!-- Inner K-Map Grid Container -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="#0f172a" stroke="#334155" stroke-width="4" />

  <!-- Grid Dividers -->
  <!-- Vertical centerline -->
  <line x1="256" y1="76" x2="256" y2="436" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 6" />
  <!-- Horizontal centerline -->
  <line x1="76" y1="256" x2="436" y2="256" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 6" />

  <!-- Internal 4x4 subtle sub-grid lines -->
  <line x1="166" y1="76" x2="166" y2="436" stroke="#1e293b" stroke-width="2" opacity="0.6" />
  <line x1="346" y1="76" x2="346" y2="436" stroke="#1e293b" stroke-width="2" opacity="0.6" />
  <line x1="76" y1="166" x2="436" y2="166" stroke="#1e293b" stroke-width="2" opacity="0.6" />
  <line x1="76" y1="346" x2="436" y2="346" stroke="#1e293b" stroke-width="2" opacity="0.6" />

  <!-- Group 1: Horizontal Loop (Cyan) across top cells -->
  <rect x="96" y="96" width="320" height="136" rx="32" 
        fill="url(#groupCyan)" stroke="#06b6d4" stroke-width="5" />
  <!-- Group 1 label badge -->
  <rect x="110" y="108" width="40" height="24" rx="6" fill="#0891b2" />
  <text x="130" y="125" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" 
        font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">G1</text>

  <!-- Group 2: Vertical Loop (Violet) across right cells -->
  <rect x="276" y="96" width="140" height="320" rx="32" 
        fill="url(#groupViolet)" stroke="#a855f7" stroke-width="5" />
  <!-- Group 2 label badge -->
  <rect x="364" y="380" width="40" height="24" rx="6" fill="#7c3aed" />
  <text x="384" y="397" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" 
        font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">G2</text>

  <!-- Cell Values (Logic 1s and 0s) -->
  <!-- Top Left (Group 1) -->
  <text x="180" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" 
        font-size="44" font-weight="800" fill="#38bdf8" text-anchor="middle">1</text>

  <!-- Top Right (Intersection of G1 and G2) -->
  <circle cx="346" cy="164" r="38" fill="#3b82f6" fill-opacity="0.3" filter="url(#softGlow)" />
  <text x="346" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" 
        font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>

  <!-- Bottom Right (Group 2) -->
  <text x="346" y="348" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" 
        font-size="44" font-weight="800" fill="#c084fc" text-anchor="middle">1</text>

  <!-- Bottom Left (Ungrouped 0) -->
  <text x="180" y="348" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" 
        font-size="44" font-weight="400" fill="#475569" text-anchor="middle">0</text>

  <!-- Corner Accent Pin: Mathematical logic indicator -->
  <path d="M 104 104 L 120 104 M 104 104 L 104 120" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <path d="M 408 408 L 392 408 M 408 408 L 408 392" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
</svg>
